# Syncra HIMS Doctor Desk: serves the SPA and proxies the API and the dictation
# WebSocket to the gateway, so the browser talks to a single origin.
#
# PRODUCTION: browsers only allow microphone access over HTTPS (or localhost).
# Terminate TLS here (listen 8443 ssl + the hospital certificate) or in front of
# this container, otherwise dictation cannot start on ward/OPD computers.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Never log query strings: the dictation WebSocket URL carries the access token.
log_format syncra_noquery '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent $request_time';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log /dev/stdout syncra_noquery;
    client_max_body_size 2m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The desk and its API share this origin, so proxied calls are same-origin by
    # construction. The browser still sends Origin (on POST and WebSocket upgrades),
    # which the gateway's CORS filter would judge against its own host and reject.
    # Dropping it here is safe: auth is a bearer token (no ambient cookies), and
    # other sites still cannot read responses, which carry no CORS headers.
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Origin "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Origin "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 1h;   # a dictation session may last up to 15 minutes
        proxy_send_timeout 1h;
    }

    # Image viewer (OHIF) and DICOMweb, through the gateway. Opened by navigation, so the
    # gateway reads an HttpOnly viewer cookie here (GET/HEAD only). OHIF brings its own scripts
    # and WebAssembly codecs, so the desk's strict CSP is not applied; framing stays same-origin.
    location /pacs/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Origin "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    # Bill print page: shows the billing service's print HTML, whose inline styles the desk's
    # CSP would block. Inline styles only; scripts from this origin only; no framing.
    location = /print.html {
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Fingerprinted build output: cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }
}

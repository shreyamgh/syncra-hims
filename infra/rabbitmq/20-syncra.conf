# Syncra HIMS RabbitMQ overrides — merged after the image's conf.d defaults.
# (rabbitmq.conf does not support trailing comments; keep comments on own lines.)

# Size memory alarms against the container limit (1 GiB in docker-compose.yml),
# not the host's RAM.
total_memory_available_override_value = 1073741824
vm_memory_high_watermark.relative = 0.6

# Block publishers before the disk fills; clinical events must never be dropped.
disk_free_limit.absolute = 2GB

management.rates_mode = basic

# =============================================================================
#  Syncra HIMS — Pharmacy Service (stock, receipts, requisitions, dispensing, H1 register)
# =============================================================================
server:
  port: 8084
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: pharmacy-service
  lifecycle:
    timeout-per-shutdown-phase: 25s
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/syncra_hims}
    username: ${SPRING_DATASOURCE_USERNAME:syncra_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      pool-name: pharmacy-service
      maximum-pool-size: 6
      minimum-idle: 1
      connection-timeout: 5000
      data-source-properties:
        ApplicationName: pharmacy-service
        logServerErrorDetail: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  server:
    port: 9094 # internal only
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}

syncra:
  security:
    jwt:

      secret: ${SYNCRA_JWT_SECRET:}
      issuer: ${SYNCRA_JWT_ISSUER:https://auth.syncra.local}
      audience: ${SYNCRA_JWT_AUDIENCE:syncra-hims}
  hospital:
    time-zone: Asia/Kolkata
  pharmacy:
    # Batches expiring within this many days are flagged (and listed for return to the supplier).
    near-expiry-days: ${SYNCRA_PHARMACY_NEAR_EXPIRY_DAYS:90}
    # Prescriptions issued within this many days are shown for dispensing.
    pending-days: ${SYNCRA_PHARMACY_PENDING_DAYS:7}
logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    root: INFO
